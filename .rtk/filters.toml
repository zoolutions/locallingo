name = "rubocop offenses survive untouched"
input = """Running RuboCop...
Inspecting 1 file
C

Offenses:

lib/locallingo/cli.rb:12:3: C: Style/StringLiterals: Prefer single-quoted strings.
    puts \"hi\"
