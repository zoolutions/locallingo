# Project-local RTK filters (https://github.com/rtk-ai/rtk#custom-filters).
#
# The `rtk hook claude` PreToolUse hook rewrites a matching command to
# `rtk <cmd>`; rtk runs it and drops the lines listed here before the agent
# sees the output. Filters are line-based: they strip noise, never reformat.
#
# `match_command` is matched against the command with the first word reduced
# to its basename, so `bin/x`, `./bin/x` and `x` all hit `^x\b`. A command run
# through `bundle exec` needs that prefix spelled out in the regex itself.
#
# Trust is a SHA-256 of this file: after every edit run `rtk trust --yes`,
# then `rtk verify` to run the inline tests.
schema_version = 1

[filters.rake]
filter_stderr = true
description = "bundle exec rake / rake rubocop: this repo's Rakefile wraps rspec (forced to --format documentation by .rspec) and rubocop in a rake task, which the built-in rspec/rubocop rewrites don't catch since the invoked command is `rake`, not `rspec`/`rubocop`. Drops the raw ruby/rspec invocation line, timings, the coverage report path, and rubocop's per-file progress boilerplate — never touches an example description, a failure block, or a count."
match_command = "^(?:bundle\\s+exec\\s+)?rake\\b"
strip_lines_matching = [
  "^\\s*$",
  "^\\S+ -I\\S.*--pattern spec/",
  "^Finished in .*$",
  "^Coverage report generated for RSpec to ",
  "^Running RuboCop\\.\\.\\.$",
  "^Inspecting \\d+ files?$",
  "^[.CWEF]+$",
]
on_empty = "rake: no output left after filtering (check the exit code)"

[[tests.rake]]
name = "clean rspec + rubocop run keeps every example line, group headers and both summaries"
input = """
/Users/x/.rubies/ruby-4.0.7/bin/ruby -I/Users/x/.gem/ruby/4.0.7/gems/rspec-core-3.13.6/lib:/Users/x/.gem/ruby/4.0.7/gems/rspec-support-3.13.7/lib /Users/x/.gem/ruby/4.0.7/gems/rspec-core-3.13.6/exe/rspec --pattern spec/\\*\\*\\{,/\\*/\\*\\*\\}/\\*_spec.rb

Randomized with seed 3811

Locallingo::StateStore
  #save
    does not rewrite a file that already ends with a trailing newline
    rewrites when content changed

Finished in 9.78 seconds (files took 5.56 seconds to load)
101 examples, 0 failures

Randomized with seed 3811

Coverage report generated for RSpec to /Users/x/repo/coverage.
Line Coverage: 87.08% (876 / 1006)
Running RuboCop...
Inspecting 40 files
........................................

40 files inspected, no offenses detected
"""
expected = """Randomized with seed 3811
Locallingo::StateStore
  #save
    does not rewrite a file that already ends with a trailing newline
    rewrites when content changed
101 examples, 0 failures
Randomized with seed 3811
Line Coverage: 87.08% (876 / 1006)
40 files inspected, no offenses detected"""

[[tests.rake]]
name = "keeps failure detail, backtrace and the failed-examples rerun hint verbatim"
input = """Randomized with seed 64272

temp failure demo
  passes
  fails on purpose (FAILED - 1)

Failures:

  1) temp failure demo fails on purpose
     Failure/Error: expect(1).to eq(2)

       expected: 2
            got: 1

       (compared using ==)
     # ./spec/zzz_temp_fail_spec.rb:3:in 'block (2 levels) in <top (required)>'

Finished in 0.05028 seconds (files took 0.97291 seconds to load)
2 examples, 1 failure

Failed examples:

rspec ./spec/zzz_temp_fail_spec.rb:2 # temp failure demo fails on purpose

Randomized with seed 64272
"""
expected = """Randomized with seed 64272
temp failure demo
  passes
  fails on purpose (FAILED - 1)
Failures:
  1) temp failure demo fails on purpose
     Failure/Error: expect(1).to eq(2)
       expected: 2
            got: 1
       (compared using ==)
     # ./spec/zzz_temp_fail_spec.rb:3:in 'block (2 levels) in <top (required)>'
2 examples, 1 failure
Failed examples:
rspec ./spec/zzz_temp_fail_spec.rb:2 # temp failure demo fails on purpose
Randomized with seed 64272"""

